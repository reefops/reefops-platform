apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkerd-control-plane
  namespace: linkerd
  annotations:
    reefops.io/chart-sha256: 03c082926698211b77f97253e517dae59a616a19e76a0153ac3857869fb5facb
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: linkerd-control-plane
      version: 2026.7.2
      sourceRef:
        kind: HelmRepository
        name: linkerd-edge
        namespace: linkerd
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllerImageVersion: edge-26.7.2@sha256:1f90252981b81537fba17e43a7a3acdad9957a3864a86324cee20217fe96016a
    controllerReplicas: 1
    proxy:
      image:
        version: edge-26.7.2@sha256:176422083de76ff53438b665651322b4e87844d3eb8aea40ee58b82b773286a0
      logHTTPHeaders: "off"
    identity:
      externalCA: true
      serviceAccountTokenProjection: true
      issuer:
        scheme: kubernetes.io/tls
    podMonitor:
      enabled: true
      labels:
        release: reefops-monitoring
    enablePSP: false
    webhookFailurePolicy: Fail
