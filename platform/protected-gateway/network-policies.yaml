apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-edge-default-deny
  namespace: reefops-gateway-system
spec:
  podSelector: {matchLabels: {reefops.io/gateway: edge}}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-edge-metrics-ingress
  namespace: reefops-gateway-system
spec:
  podSelector: {matchLabels: {reefops.io/gateway: edge}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: reefops-observability}}
      ports: [{protocol: TCP, port: 19001}, {protocol: TCP, port: 4191}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-edge-egress
  namespace: reefops-gateway-system
spec:
  podSelector: {matchLabels: {reefops.io/gateway: edge}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector: {matchLabels: {control-plane: envoy-gateway}}
      ports: [{protocol: TCP, port: 18000}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: linkerd}}
      ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 8086}, {protocol: TCP, port: 8090}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: reefops-observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
      ports: [{protocol: TCP, port: 4317}]
