apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openfga-postgresql
  namespace: reefops-identity
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: {kind: SecretStore, name: openbao-openfga}
  target:
    name: openfga-postgresql
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        uri: "postgres://openfga:{{ .password }}@reefops-postgresql-rw.reefops-data.svc:5432/openfga?sslmode=require"
  data:
    - secretKey: password
      remoteRef: {key: identity/openfga-postgresql, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openfga-auth
  namespace: reefops-identity
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: {kind: SecretStore, name: openbao-openfga}
  target:
    name: openfga-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        keys: "{{ .bootstrap_key }},{{ .runtime_key }}"
  data:
    - secretKey: bootstrap_key
      remoteRef: {key: identity/openfga-auth, property: bootstrap_key}
    - secretKey: runtime_key
      remoteRef: {key: identity/openfga-auth, property: runtime_key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authorizer-security
  namespace: reefops-identity
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: {kind: SecretStore, name: openbao-openfga}
  target:
    name: authorizer-security
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        AUDIT_DATABASE_URL: "postgres://reefops_authorizer_runtime:{{ .database_password }}@reefops-postgresql-rw.reefops-data.svc:5432/reefops_authorizer_audit?sslmode=require"
        ACTOR_CONTEXT_ACTIVE_KID: "{{ .active_kid }}"
        ACTOR_CONTEXT_PRIVATE_KEY_PKCS8_PEM_B64: "{{ .private_key }}"
        ACTOR_CONTEXT_PUBLIC_KEY_PEM_B64: "{{ .public_key }}"
        ACTOR_CONTEXT_ALGORITHM: "{{ .algorithm }}"
  data:
    - secretKey: database_password
      remoteRef: {key: identity/authorizer-postgresql, property: password}
    - secretKey: active_kid
      remoteRef: {key: identity/authorizer-signing, property: active_kid}
    - secretKey: private_key
      remoteRef: {key: identity/authorizer-signing, property: private_key_pkcs8_pem_b64}
    - secretKey: public_key
      remoteRef: {key: identity/authorizer-signing, property: public_key_pem_b64}
    - secretKey: algorithm
      remoteRef: {key: identity/authorizer-signing, property: algorithm}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openfga-runtime
  namespace: reefops-identity
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: {kind: SecretStore, name: openbao-openfga}
  target:
    name: openfga-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: reefops-authorizer
          app.kubernetes.io/part-of: reefops
          reefops.io/environment: development
      data:
        OPENFGA_API_URL: "{{ .api_url }}"
        OPENFGA_STORE_ID: "{{ .store_id }}"
        OPENFGA_AUTHORIZATION_MODEL_ID: "{{ .authorization_model_id }}"
        OPENFGA_ENVIRONMENT_ID: "{{ .environment_id }}"
        OPENFGA_MODEL_SHA256: "{{ .model_sha256 }}"
        OPENFGA_ARTIFACT_DIGEST: "{{ .artifact_digest }}"
        OPENFGA_PROMOTION_ID: "{{ .promotion_id }}"
        OPENFGA_API_TOKEN: "{{ .runtime_key }}"
  data:
    - secretKey: api_url
      remoteRef: {key: identity/openfga-runtime, property: api_url}
    - secretKey: store_id
      remoteRef: {key: identity/openfga-runtime, property: store_id}
    - secretKey: authorization_model_id
      remoteRef: {key: identity/openfga-runtime, property: authorization_model_id}
    - secretKey: environment_id
      remoteRef: {key: identity/openfga-runtime, property: environment_id}
    - secretKey: model_sha256
      remoteRef: {key: identity/openfga-runtime, property: model_sha256}
    - secretKey: artifact_digest
      remoteRef: {key: identity/openfga-runtime, property: artifact_digest}
    - secretKey: promotion_id
      remoteRef: {key: identity/openfga-runtime, property: promotion_id}
    - secretKey: runtime_key
      remoteRef: {key: identity/openfga-auth, property: runtime_key}
