apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seaweedfs-isolation
  namespace: reefops-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: reefops-seaweedfs
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
              app.kubernetes.io/instance: reefops-seaweedfs
    - from:
        - namespaceSelector:
            matchLabels:
              reefops.io/environment: development
              reefops.io/s3-access: "true"
          podSelector:
            matchLabels:
              reefops.io/s3-client: "true"
      ports:
        - protocol: TCP
          port: 8333
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: reefops-observability
              reefops.io/environment: development
      ports:
        - protocol: TCP
          port: 9327
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
              app.kubernetes.io/instance: reefops-seaweedfs
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
