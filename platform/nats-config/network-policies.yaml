apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reefops-nats-default-deny
  namespace: reefops-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/instance: reefops-nats
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reefops-nats-allow-observability
  namespace: reefops-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/instance: reefops-nats
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: reefops-observability
      ports:
        - protocol: TCP
          port: 7777
