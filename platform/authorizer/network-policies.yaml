apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authorizer-default-deny
  namespace: reefops-identity
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: reefops-authorizer}}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authorizer-grpc-ingress
  namespace: reefops-identity
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: reefops-authorizer}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: reefops-gateway-system}
      ports: [{protocol: TCP, port: 9002}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authorizer-metrics-ingress
  namespace: reefops-identity
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: reefops-authorizer}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: reefops-observability}
      ports: [{protocol: TCP, port: 9003}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: reefops-observability}
      ports: [{protocol: TCP, port: 4191}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authorizer-dns-egress
  namespace: reefops-identity
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: reefops-authorizer}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: linkerd}}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8086}
        - {protocol: TCP, port: 8090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authorizer-dependency-egress
  namespace: reefops-identity
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: reefops-authorizer}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: openfga}}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: reefops-data}}
          podSelector: {matchLabels: {cnpg.io/cluster: reefops-postgresql}}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: reefops-observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
      ports: [{protocol: TCP, port: 4317}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-authorizer-ingress
  namespace: reefops-data
spec:
  podSelector: {matchLabels: {cnpg.io/cluster: reefops-postgresql}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: reefops-identity}}
          podSelector: {matchLabels: {app.kubernetes.io/name: reefops-authorizer}}
      ports: [{protocol: TCP, port: 5432}]
