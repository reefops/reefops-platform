apiVersion: v1
kind: ServiceAccount
metadata:
  name: reefops-authorizer
  namespace: reefops-identity
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reefops-authorizer
  namespace: reefops-identity
  labels:
    app.kubernetes.io/name: reefops-authorizer
    app.kubernetes.io/component: authorization
    app.kubernetes.io/part-of: reefops
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: reefops-authorizer}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reefops-authorizer
        app.kubernetes.io/component: authorization
        app.kubernetes.io/part-of: reefops
        reefops.io/environment: development
      annotations:
        linkerd.io/inject: enabled
        config.linkerd.io/proxy-cpu-request: 10m
        config.linkerd.io/proxy-cpu-limit: 100m
        config.linkerd.io/proxy-memory-request: 20Mi
        config.linkerd.io/proxy-memory-limit: 100Mi
    spec:
      serviceAccountName: reefops-authorizer
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: reefops-authorizer}
      containers:
        - name: authorizer
          image: ghcr.io/reefops/reefops-authorizer@sha256:d81a1be9c275aaace6d4834ed5f72a88481f45314c4eed6db490647760abb8e0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: authorizer-security}
            - secretRef: {name: openfga-runtime}
          env:
            - {name: AUTHORIZER_GRPC_LISTEN_ADDRESS, value: ":9002"}
            - {name: AUTHORIZER_MANAGEMENT_LISTEN_ADDRESS, value: ":9003"}
            - {name: ACTOR_CONTEXT_AUDIENCE, value: reefops-services}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: otel-collector.reefops-observability.svc.cluster.local:4317}
            - {name: REEFOPS_VERSION, value: 1d89b8b1}
          ports:
            - {name: grpc, containerPort: 9002, protocol: TCP}
            - {name: metrics, containerPort: 9003, protocol: TCP}
          startupProbe: {httpGet: {path: /livez, port: metrics}, periodSeconds: 2, failureThreshold: 30, timeoutSeconds: 1}
          readinessProbe: {httpGet: {path: /readyz, port: metrics}, periodSeconds: 5, failureThreshold: 2, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /livez, port: metrics}, periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 1}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: reefops-authorizer
  namespace: reefops-identity
  labels: {app.kubernetes.io/name: reefops-authorizer}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: reefops-authorizer}
  ports:
    - {name: grpc, port: 9002, targetPort: grpc, appProtocol: grpc}
    - {name: metrics, port: 9003, targetPort: metrics}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reefops-authorizer
  namespace: reefops-identity
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: reefops-authorizer}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reefops-authorizer
  namespace: reefops-identity
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: reefops-authorizer}
  minReplicas: 1
  maxReplicas: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Percent, value: 100, periodSeconds: 60}, {type: Pods, value: 2, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 50, periodSeconds: 60}]
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: reefops-authorizer-grpc
  namespace: reefops-identity
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: reefops-authorizer}}
  port: grpc
  proxyProtocol: gRPC
  accessPolicy: authenticated
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: reefops-authorizer-from-envoy
  namespace: reefops-identity
spec:
  identities:
    - reefops-envoy-edge.reefops-gateway-system.serviceaccount.identity.linkerd.cluster.local
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: reefops-authorizer-from-envoy
  namespace: reefops-identity
spec:
  targetRef: {group: policy.linkerd.io, kind: Server, name: reefops-authorizer-grpc}
  requiredAuthenticationRefs:
    - {group: policy.linkerd.io, kind: MeshTLSAuthentication, name: reefops-authorizer-from-envoy}
