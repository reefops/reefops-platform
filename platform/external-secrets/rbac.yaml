apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-openbao-token-request
  namespace: reefops-secret-delivery
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - external-secrets-openbao
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-openbao-token-request
  namespace: reefops-secret-delivery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-openbao-token-request
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: reefops-secret-delivery
