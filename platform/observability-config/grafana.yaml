apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: reefops-observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: reefops-observability
data:
  grafana.ini: |
    [analytics]
    check_for_updates = false
    reporting_enabled = false

    [auth]
    disable_login_form = true

    [auth.basic]
    enabled = false

    [auth.anonymous]
    enabled = true
    org_role = Viewer

    [security]
    disable_initial_admin_creation = true

    [users]
    allow_sign_up = false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: reefops-observability
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://reefops-monitoring-prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: reefops-observability
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: ReefOps
        orgId: 1
        folder: ReefOps
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform
  namespace: reefops-observability
data:
  platform.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "count(up == 1)", "refId": "A"}],
          "title": "Targets available",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [{"expr": "sum(ALERTS{alertstate=\"firing\"})", "refId": "A"}],
          "title": "Firing alerts",
          "type": "stat"
        }
      ],
      "schemaVersion": 42,
      "tags": ["reefops", "platform"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "title": "ReefOps Platform",
      "uid": "reefops-platform",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-seaweedfs
  namespace: reefops-observability
data:
  seaweedfs.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "sum(up{namespace=\"reefops-data\",service=~\"reefops-seaweedfs-.*\"})", "refId": "A"}],
          "title": "SeaweedFS targets available",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [{"expr": "sum(kubelet_volume_stats_used_bytes{namespace=\"reefops-data\",persistentvolumeclaim=~\".*reefops-seaweedfs.*\"})", "refId": "A"}],
          "title": "SeaweedFS persistent storage used",
          "type": "stat"
        }
      ],
      "schemaVersion": 42,
      "tags": ["reefops", "seaweedfs", "storage"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "title": "ReefOps SeaweedFS",
      "uid": "reefops-seaweedfs",
      "version": 1
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
  namespace: reefops-observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: reefops-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: reefops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: reefops
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.0.1-security-01@sha256:2d1f9ae67c1778d33e291d4c3c759cd8b650e67491f02533499eb950e075eeb5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
              readOnly: true
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yaml
              subPath: prometheus.yaml
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
              subPath: provider.yaml
              readOnly: true
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: grafana
        - name: config
          configMap:
            name: grafana-config
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-platform
              - configMap:
                  name: grafana-dashboard-seaweedfs
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: reefops-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: reefops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
