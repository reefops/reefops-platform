apiVersion: v1
kind: Service
metadata:
  name: helm-controller-metrics
  namespace: flux-system
  labels:
    reefops.io/metrics: flux
spec:
  selector:
    app: helm-controller
  ports:
    - name: http-prom
      port: 8080
      targetPort: http-prom
---
