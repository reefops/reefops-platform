apiVersion: v1
kind: ConfigMap
metadata:
  name: reefops-postgresql-dashboard
  namespace: reefops-observability
  labels:
    app.kubernetes.io/name: reefops-postgresql
    app.kubernetes.io/part-of: reefops
    reefops.io/environment: development
    grafana_dashboard: "1"
data:
  reefops-postgresql.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "panels": [
        {
          "title": "Instancias saludables",
          "type": "stat",
          "targets": [{"expr": "cnpg_collector_up{namespace=\"reefops-data\",cluster=\"reefops-postgresql\"}", "refId": "A"}],
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0}
        },
        {
          "title": "Último backup disponible",
          "type": "stat",
          "targets": [{"expr": "time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace=\"reefops-data\",cluster=\"reefops-postgresql\"}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0}
        },
        {
          "title": "Tamaño de base de datos",
          "type": "timeseries",
          "targets": [{"expr": "cnpg_pg_database_size_bytes{namespace=\"reefops-data\",cluster=\"reefops-postgresql\"}", "refId": "A"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0}
        }
      ],
      "schemaVersion": 39,
      "tags": ["reefops", "postgresql", "development"],
      "templating": {"list": []},
      "time": {"from": "now-24h", "to": "now"},
      "title": "ReefOps / PostgreSQL",
      "uid": "reefops-postgresql",
      "version": 1
    }
