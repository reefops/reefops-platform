apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: reefops-secret-delivery
spec:
  provider:
    vault:
      server: https://openbao.reefops-secrets.svc:8200
      path: ci
      version: v2
      caProvider:
        type: ConfigMap
        name: openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: reefops-external-secrets
          serviceAccountRef:
            name: external-secrets-openbao
