apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-barman-s3
  namespace: reefops-data
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: openbao-postgresql
  target:
    name: postgresql-barman-s3
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: postgresql-barman
          app.kubernetes.io/part-of: reefops
          reefops.io/environment: development
          cnpg.io/reload: "true"
      data:
        ACCESS_KEY_ID: "{{ .access_key }}"
        ACCESS_SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: postgresql/barman-s3
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: postgresql/barman-s3
        property: secret_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openfga-postgresql
  namespace: reefops-data
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: openbao-postgresql
  target:
    name: openfga-postgresql
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: openfga
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: identity/openfga-postgresql
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authorizer-postgresql
  namespace: reefops-data
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: {kind: SecretStore, name: openbao-postgresql}
  target:
    name: authorizer-postgresql
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: reefops_authorizer_runtime
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: {key: identity/authorizer-postgresql, property: password}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authorizer-migrator-postgresql
  namespace: reefops-data
spec:
  refreshPolicy: Periodic
  refreshInterval: 5m
  secretStoreRef: {kind: SecretStore, name: openbao-postgresql}
  target:
    name: authorizer-migrator-postgresql
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: reefops_authorizer_migrator
        password: "{{ .password }}"
        uri: "postgresql://reefops_authorizer_migrator:{{ .password | urlquery }}@reefops-postgresql-rw.reefops-data.svc:5432/reefops_authorizer_audit?sslmode=require"
  data:
    - secretKey: password
      remoteRef: {key: identity/authorizer-migrator-postgresql, property: password}
