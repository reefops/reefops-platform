apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-postgresql-openbao
  namespace: reefops-data
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-postgresql-openbao-token-request
  namespace: reefops-data
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - external-secrets-postgresql-openbao
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-postgresql-openbao-token-request
  namespace: reefops-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-postgresql-openbao-token-request
subjects:
  - kind: ServiceAccount
    name: external-secrets-data
    namespace: reefops-data
