apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: reefops-postgresql-recovery-drill
  namespace: reefops-data
  labels:
    app.kubernetes.io/name: reefops-postgresql-recovery-drill
    app.kubernetes.io/part-of: reefops
    reefops.io/environment: development
    reefops.io/lifecycle: ephemeral
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgis:18-3-standard-trixie@sha256:0b3f86d55fcbafad6fcde45ca58fa816d4d37bab26abc67a4cefe16d562fd05f
  imagePullPolicy: IfNotPresent
  enableSuperuserAccess: false
  primaryUpdateStrategy: unsupervised
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: reefops-postgresql-recovery-drill
      app.kubernetes.io/part-of: reefops
      reefops.io/environment: development
      reefops.io/lifecycle: ephemeral
  bootstrap:
    recovery:
      source: origin
      recoveryTarget:
        backupID: ${REEFOPS_POSTGRESQL_RECOVERY_BACKUP_ID}
        targetName: ${REEFOPS_POSTGRESQL_RECOVERY_TARGET}
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: reefops-postgresql-recovery-source
          serverName: reefops-postgresql
  storage:
    size: 5Gi
    storageClass: reefops-hostpath-delete
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  postgresql:
    parameters:
      log_connections: "on"
      log_disconnections: "on"
      log_lock_waits: "on"
      log_min_duration_statement: "1000"
      password_encryption: scram-sha-256
      ssl_min_protocol_version: TLSv1.3
