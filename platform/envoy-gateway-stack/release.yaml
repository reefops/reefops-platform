apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reefops-envoy-gateway
  namespace: reefops-gateway-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: reefops-envoy-gateway
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    commonLabels:
      app.kubernetes.io/part-of: reefops
      reefops.io/environment: development

    global:
      images:
        envoyGateway:
          image: docker.io/envoyproxy/gateway@sha256:e7a8c70537628bf996e5dec5c4c835704b4b9f4f715a74cf361bea30608c49ac
          pullPolicy: IfNotPresent
        ratelimit:
          image: docker.io/envoyproxy/ratelimit@sha256:5bb3741fd6709bab1d498eae1a5807faa2113b712dfb236fb76c04a00871ffc9
          pullPolicy: IfNotPresent

    deployment:
      replicas: 1
      envoyGateway:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

    service:
      type: ClusterIP

    topologyInjector:
      enabled: false

    certgen:
      job:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

    config:
      envoyGateway:
        gateway:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
            watch:
              type: Namespaces
              namespaces:
                - reefops-gateway-system
                - reefops-observability
        logging:
          level:
            default: info
        extensionApis: {}
