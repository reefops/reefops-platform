apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: reefops-postgresql-daily
  namespace: reefops-data
  labels:
    app.kubernetes.io/name: reefops-postgresql
    app.kubernetes.io/part-of: reefops
    reefops.io/environment: development
spec:
  schedule: "0 15 2 * * *"
  backupOwnerReference: self
  immediate: true
  cluster:
    name: reefops-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
