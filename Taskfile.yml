version: "3"

tasks:
  prerequisites:
    desc: Comprueba herramientas, contexto y prerrequisitos del clúster
    cmds:
      - ./bootstrap/scripts/check-prerequisites.sh

  validate:
    desc: Render all reusable Kubernetes roots
    cmds:
      - kubectl kustomize infrastructure/base >/dev/null
      - kubectl kustomize environments/development >/dev/null
      - kubectl kustomize platform >/dev/null
      - kubectl kustomize platform/observability-stack >/dev/null
      - kubectl kustomize platform/observability-config >/dev/null
      - kubectl kustomize platform/envoy-gateway-stack >/dev/null
      - kubectl kustomize platform/envoy-gateway-config >/dev/null
      - kubectl kustomize platform/seaweedfs-secret >/dev/null
      - kubectl kustomize platform/seaweedfs-stack >/dev/null
      - kubectl kustomize platform/seaweedfs-config >/dev/null
      - kubectl kustomize platform/cloudnative-pg-stack >/dev/null
      - kubectl kustomize platform/barman-cloud-stack >/dev/null
      - kubectl kustomize platform/postgresql-secret >/dev/null
      - kubectl kustomize platform/postgresql-cluster >/dev/null
      - kubectl kustomize platform/postgresql-config >/dev/null
      - kubectl kustomize recovery/openbao >/dev/null
      - kubectl kustomize infrastructure/base | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize environments/development | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform/observability-stack | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform/observability-config | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform/envoy-gateway-stack | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform/envoy-gateway-config | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform/seaweedfs-secret | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform/seaweedfs-stack | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform/seaweedfs-config | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform/cloudnative-pg-stack | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform/barman-cloud-stack | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform/postgresql-secret | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform/postgresql-cluster | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize platform/postgresql-config | kubeconform -strict -ignore-missing-schemas -summary
      - kubectl kustomize recovery/openbao | kubeconform -strict -ignore-missing-schemas -summary
      - bash -n bootstrap/scripts/*.sh bootstrap/scripts/lib/*.sh bootstrap/tests/*.sh
      - shellcheck bootstrap/scripts/*.sh bootstrap/scripts/lib/*.sh
      - shellcheck bootstrap/tests/*.sh
      - ./bootstrap/tests/test-environment-foundation.sh
      - ./bootstrap/tests/test-external-secrets-openbao.sh
      - ./bootstrap/tests/test-openbao-artifacts.sh
      - ./bootstrap/tests/test-observability-artifacts.sh
      - ./bootstrap/tests/test-observability-config.sh
      - ./bootstrap/tests/test-observability-evidence-backup.sh
      - ./bootstrap/tests/test-envoy-gateway-artifacts.sh
      - ./bootstrap/tests/test-envoy-gateway-config.sh
      - ./bootstrap/tests/test-envoy-gateway-evidence-backup.sh
      - ./bootstrap/tests/test-seaweedfs-artifacts.sh
      - ./bootstrap/tests/test-seaweedfs-config.sh
      - ./bootstrap/tests/test-postgresql-artifacts.sh
      - ./bootstrap/tests/test-postgresql-config.sh
      - ./bootstrap/tests/test-openbao-recovery-close.sh
      - ./bootstrap/tests/test-openbao-recovery-target-allowlist.sh
      - gitleaks git --no-banner --redact --exit-code 1 .

  openbao-configure:
    desc: Configura auditoría, políticas y auth Kubernetes tras init y unseal
    cmds:
      - ./bootstrap/scripts/run-configure-openbao.sh

  openbao-verify-bootstrap:
    desc: Verifica OpenBao con una identidad Kubernetes de mínimo privilegio
    cmds:
      - ./bootstrap/scripts/verify-openbao-bootstrap.sh

  openbao-verify-eso:
    desc: Verifica autenticación, refresco y fallo cerrado de ESO con OpenBao
    cmds:
      - ./bootstrap/scripts/verify-external-secrets-openbao.sh

  seaweedfs-credentials-bootstrap:
    desc: Crea una sola vez la identidad S3 y la custodia en OpenBao
    cmds:
      - ./bootstrap/scripts/run-bootstrap-seaweedfs-credentials.sh

  seaweedfs-verify:
    desc: Verifica contrato S3, aislamiento y persistencia tras reinicios
    cmds:
      - ./bootstrap/scripts/verify-seaweedfs.sh

  seaweedfs-recovery-verify:
    desc: Cifra un backup sintético externo y prueba restore aislado
    cmds:
      - ./bootstrap/scripts/verify-seaweedfs-recovery.sh

  postgresql-backup-credentials-bootstrap:
    desc: Crea una sola vez la identidad Barman y la custodia en OpenBao
    cmds:
      - ./bootstrap/scripts/run-bootstrap-postgresql-backup-credentials.sh

  postgresql-backup-bucket-prepare:
    desc: Crea idempotentemente el bucket y prueba la identidad Barman acotada
    cmds:
      - ./bootstrap/scripts/prepare-postgresql-backup-bucket.sh

  observability-verify:
    desc: Verifica alertas, persistencia y evidencia de observabilidad
    cmds:
      - ./bootstrap/scripts/verify-observability.sh

  observability-evidence-backup:
    desc: Cifra la cadena de evidencia fuera del clúster
    cmds:
      - ./bootstrap/scripts/backup-observability-evidence.sh

  observability-evidence-backup-verify:
    desc: Descifra y verifica la integridad del backup de evidencia
    cmds:
      - ./bootstrap/scripts/verify-observability-evidence-backup.sh

  envoy-gateway-verify:
    desc: Verifica la fundación inerte de Envoy Gateway
    cmds:
      - ./bootstrap/scripts/verify-envoy-gateway.sh

  envoy-gateway-evidence-backup:
    desc: Cifra la evidencia de Envoy Gateway fuera del clúster
    cmds:
      - ./bootstrap/scripts/backup-envoy-gateway-evidence.sh

  envoy-gateway-evidence-backup-verify:
    desc: Descifra y verifica el backup de evidencia de Envoy Gateway
    cmds:
      - ./bootstrap/scripts/verify-envoy-gateway-evidence-backup.sh

  openbao-backup:
    desc: Crea un snapshot Raft cifrado fuera del clúster
    cmds:
      - ./bootstrap/scripts/backup-openbao.sh

  openbao-verify-backup:
    desc: Verifica un snapshot cifrado sin restaurarlo
    cmds:
      - ./bootstrap/scripts/verify-openbao-backup.sh

  openbao-ca-backup:
    desc: Cifra y respalda la CA local fuera del clúster
    cmds:
      - ./bootstrap/scripts/backup-openbao-ca.sh

  openbao-ca-restore:
    desc: Restaura la CA local con confirmación explícita
    cmds:
      - ./bootstrap/scripts/restore-openbao-ca.sh

  openbao-verify-recovery:
    desc: Verifica la autoridad restaurada sin revelar secretos
    cmds:
      - ./bootstrap/scripts/verify-openbao-recovery.sh

  openbao-tls-reload:
    desc: Recarga el certificado TLS renovado y verifica su serial
    cmds:
      - ./bootstrap/scripts/reload-openbao-tls.sh

  openbao-config-reload:
    desc: Activa la configuración HCL reconciliada y recarga OpenBao
    cmds:
      - ./bootstrap/scripts/reload-openbao-config.sh

  openbao-recovery-preflight:
    desc: Verifica el aislamiento antes del ensayo de recuperación
    cmds:
      - ./bootstrap/scripts/verify-openbao-recovery-isolation.sh

  openbao-recovery-init:
    desc: Inicializa y abre temporalmente el target aislado sin exponer material
    cmds:
      - ./bootstrap/scripts/initialize-openbao-recovery.sh

  openbao-recovery-restore:
    desc: Aplica el snapshot al target aislado con guardas y aprobación local
    cmds:
      - ./bootstrap/scripts/run-openbao-recovery-restore.sh

  openbao-recovery-approve:
    desc: Registra interactivamente la aprobación acotada del restore aislado
    cmds:
      - ./bootstrap/scripts/approve-openbao-recovery-restore.sh

  openbao-recovery-evidence-seal:
    desc: Cifra audit e inventario persistente tras verificar el restore
    cmds:
      - ./bootstrap/scripts/seal-openbao-recovery-evidence.sh

  openbao-recovery-close:
    desc: Cierra y archiva idempotentemente un ensayo verificado
    cmds:
      - ./bootstrap/scripts/close-openbao-recovery-drill.sh

  openbao-recovery-cleanup-verify:
    desc: Confirma que no quedan recursos del ensayo de recuperación
    cmds:
      - ./bootstrap/scripts/verify-openbao-recovery-cleanup.sh
