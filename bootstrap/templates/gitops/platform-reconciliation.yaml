apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reefops-infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infrastructure/base
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: reefops-platform
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reefops-cert-manager
  namespace: flux-system
spec:
  dependsOn:
    - name: reefops-infrastructure
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./platform/cert-manager
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: reefops-platform
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reefops-openbao-pki
  namespace: flux-system
spec:
  dependsOn:
    - name: reefops-cert-manager
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./platform/openbao-pki
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: reefops-platform
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reefops-openbao
  namespace: flux-system
spec:
  dependsOn:
    - name: reefops-openbao-pki
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./platform/openbao
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: reefops-platform
